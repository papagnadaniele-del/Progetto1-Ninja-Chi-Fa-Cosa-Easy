const ROOM_NAMES_KEY = "turno_room_names";
function loadRoomNames() {
  try { return JSON.parse(localStorage.getItem(ROOM_NAMES_KEY)) || {}; }
  catch(e) { return {}; }
}
function saveRoomNames(names) {
  localStorage.setItem(ROOM_NAMES_KEY, JSON.stringify(names));
}
let roomNames = loadRoomNames();
function getRoomLabel(id, fallback) {
  return roomNames[id] || fallback;
}
function setRoomLabel(id, value) {
  if (value && value.trim()) roomNames[id] = value.trim();
  else delete roomNames[id];
  saveRoomNames(roomNames);
}

function cellsKey(monday) { return "turno_cells_" + isoDate(monday); }
function loadCells(monday) {
  try { return JSON.parse(localStorage.getItem(cellsKey(monday))) || {}; }
  catch(e) { return {}; }
}
function saveCells(monday, data) {
  localStorage.setItem(cellsKey(monday), JSON.stringify(data));

/* ============================================================
   LOGICA RENDERING
   ============================================================ */
function getMonday(d) {
  const date = new Date(d);
  const day = (date.getDay() + 6) % 7;
  date.setDate(date.getDate() - day);
  date.setHours(0,0,0,0);
  return date;
}
function isoDate(d) { return d.toISOString().slice(0,10); }
function weekNumber(d) {
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = (date.getUTCDay() + 6) % 7;
  date.setUTCDate(date.getUTCDate() - dayNum + 3);
  const firstThu = new Date(Date.UTC(date.getUTCFullYear(),0,4));
  return 1 + Math.round(((date - firstThu) / 86400000 - 3 + ((firstThu.getUTCDay()+6)%7)) / 7);
}

/* Crea una cella-etichetta riga (con input modificabile se editable) */
function makeLabelCell(row, sectionClass) {
  const td = document.createElement("td");
  td.className = "col-cat" + (row.type === "sub" ? " sub" : "") + " " + sectionClass;
  if (row.editable) {
    const input = document.createElement("input");
    input.className = "room-input";
    input.type = "text";
    /* Se la riga è collegata a un'altra (es. sale pomeridiane -> sale mattino),
       usa la stessa chiave di salvataggio per condividere il nome */
    const storageId = row.linkTo || row.id;
    input.value = getRoomLabel(storageId, row.label);
    input.placeholder = row.label;
    input.setAttribute("aria-label", "Nome " + row.label);
    input.addEventListener("change", () => {
      setRoomLabel(storageId, input.value);
      /* Aggiorna tutte le celle collegate allo stesso storageId */
      each(document.querySelectorAll('input.room-input[data-store="' + storageId + '"]'), (el) => {
        if (el !== input) el.value = getRoomLabel(storageId, row.label);
      });
    });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { input.blur(); }
    });
    input.setAttribute("data-store", storageId);
    td.appendChild(input);
  } else {
    td.textContent = row.label;
  }
  return td;
}

/* Auto-resize di una textarea in base al contenuto */
function autoResize(el) {
  // In modalità stampa, calcola l'altezza in base al numero di righe
  // (più affidabile in wkhtmltopdf che non supporta bene scrollHeight)
  const isPrintMode = window.location.search.indexOf('print=1') !== -1;
  if (isPrintMode) {
    const lines = (el.value || "").split("\n");
    const lineCount = Math.max(1, lines.length);
    el.style.height = (lineCount * 1.35) + "em";
    return;
  }
  el.style.height = "auto";
  el.style.height = el.scrollHeight + "px";
}

/* Estrae testo semplice da una stringa HTML (per i dati precompilati delle settimane).
   Sostituisce i tag con testo leggibile (es. tag FERIE -> "FERIE", separatori ·, ecc.) */
function htmlToText(html) {
  if (!html) return "";
  const tmp = document.createElement("div");
  tmp.innerHTML = html;
  // Sostituisci <br> con a capo
  each(tmp.querySelectorAll("br"), function(br) {
    // Compatibile QtWebKit: replaceWith non supportato, usa parentNode
    var txt = document.createTextNode("\n");
    if (br.parentNode) br.parentNode.replaceChild(txt, br);
  });
  // Aggiungi uno spazio prima del testo di ogni tag (es. REP, FERIE, J)
  each(tmp.querySelectorAll(".tag"), function(t) {
    t.insertAdjacentText("beforebegin", " ");
  });
  let text = tmp.textContent || "";
  text = text.replace(/[ \t]+/g, " ").trim();
  // Se il testo è solo un em-dash (cella vuota), ritorna stringa vuota
  if (text === "—" || text === "--" || text === "— ") return "";
  return text;
}

/* Crea una riga di contenuto */
function makeRow(row, days, data, sectionClass, cellsData, monday) {
  const tr = document.createElement("tr");
  tr.className = sectionClass + "-row";
  if (row.type === "cat") tr.classList.add("cat-main");

  tr.appendChild(makeLabelCell(row, sectionClass));

  const rowData = data[row.id] || [];
  const isPrintMode = window.location.search.indexOf('print=1') !== -1;

  for (let i = 0; i < days.length; i++) {
    const td = document.createElement("td");
    td.className = "cell " + sectionClass;
    if (i >= 5) td.classList.add("weekend");

    // Celle modificabili con Specialità + Equipe per Sale A/B/E (lun-ven = indici 0-4)
    if (row.editableCells && i < 5) {
      td.classList.add("editable");
      const storageId = row.cellsLinkTo || row.id;
      const cellKey = storageId + "_" + i;
      const saved = cellsData[cellKey] || {};

      // Se non c'è nulla salvato in localStorage, usa i dati precompilati come fallback
      let initSpecialty = saved.specialty;
      let initTeam = saved.team;
      if (initSpecialty === undefined && initTeam === undefined) {
        const preset = rowData[i];
        if (preset && typeof preset === 'string' && preset.indexOf('cell-content') !== -1) {
          // Estrai specialità ed equipe dalla stringa HTML precompilata
          const tmp = document.createElement("div");
          tmp.innerHTML = preset;
          const specEl = tmp.querySelector(".cell-specialty");
          const staffEl = tmp.querySelector(".cell-staff");
          // Aggiungi spazi prima dei tag (REP, FERIE, J, ecc.)
          each(tmp.querySelectorAll(".tag"), function(t) {
            t.insertAdjacentText("beforebegin", " ");
          });
          if (specEl) initSpecialty = specEl.textContent || "";
          if (staffEl) {
            initTeam = (staffEl.textContent || "");
            // Aggiungi eventuali tag dopo staff
            var afterStaff = staffEl.nextSibling;
            while (afterStaff) {
              if (afterStaff.nodeType === 3) initTeam += afterStaff.textContent;
              else if (afterStaff.nodeType === 1) initTeam += " " + afterStaff.textContent;
              afterStaff = afterStaff.nextSibling;
            }
            initTeam = initTeam.replace(/[ \t]+/g, " ").trim();
          }
        }
      }

      const wrap = document.createElement("div");
      wrap.className = "cell-fields";

      if (isPrintMode) {
        // In stampa: usa div statici (non editabili) per compatibilità wkhtmltopdf
        const specDiv = document.createElement("div");
        specDiv.className = "cell-field-print specialty";
        specDiv.textContent = initSpecialty || "";
        const teamDiv = document.createElement("div");
        teamDiv.className = "cell-field-print team";
        teamDiv.textContent = initTeam || "";
        wrap.appendChild(specDiv);
        if (initTeam) wrap.appendChild(teamDiv);
      } else {
        // Campo Specialità (input a riga singola)
        const specInput = document.createElement("input");
        specInput.type = "text";
        specInput.className = "cell-field specialty";
        specInput.value = initSpecialty || "";
        specInput.placeholder = isPrintMode ? "" : "Specialità";
        specInput.setAttribute("data-cellkey", cellKey);
        specInput.setAttribute("data-field", "specialty");

        // Campo Equipe (textarea multilinea con auto-resize)
        const teamInput = document.createElement("textarea");
        teamInput.className = "cell-field team";
        teamInput.rows = 1;
        teamInput.value = initTeam || "";
        teamInput.placeholder = isPrintMode ? "" : "Equipe";
        teamInput.setAttribute("data-cellkey", cellKey);
        teamInput.setAttribute("data-field", "team");

        const persist = () => {
          const cur = loadCells(currentMonday);
          const ck = specInput.getAttribute("data-cellkey");
          if (!cur[ck]) cur[ck] = {};
          cur[ck].specialty = specInput.value;
          cur[ck].team = teamInput.value;
          if (cur[ck].specialty || cur[ck].team) {
            saveCells(currentMonday, cur);
          } else {
            delete cur[ck];
            saveCells(currentMonday, cur);
          }
        };
        specInput.addEventListener("change", persist);
        teamInput.addEventListener("change", persist);
        teamInput.addEventListener("input", () => autoResize(teamInput));
        specInput.addEventListener("keydown", e => { if (e.key === "Enter") specInput.blur(); });

        wrap.appendChild(specInput);
        wrap.appendChild(teamInput);
      }
      td.appendChild(wrap);
    }
    // Celle modificabili con SOLO Equipe (multilinea) per Ancona, Accessi Vascolari,
    // Sterilizzazione, Ufficio, Reperibilità, Assenze — tutti i 7 giorni
    else if (row.editableTeam) {
      td.classList.add("editable");
      const storageId = row.id;
      const cellKey = storageId + "_" + i;
      const saved = cellsData[cellKey] || {};
      // Se l'utente ha salvato un valore, usa quello; altrimenti usa il testo precompilato
      let initialTeam = saved.team;
      if (initialTeam === undefined) {
        const preset = rowData[i];
        if (preset !== undefined && preset !== "") {
          initialTeam = htmlToText(preset);
        } else {
          initialTeam = "";
        }
      }

      const wrap = document.createElement("div");
      wrap.className = "cell-fields team-only";

      if (isPrintMode) {
        // In stampa: usa div statico
        const teamDiv = document.createElement("div");
        teamDiv.className = "cell-field-print team";
        teamDiv.textContent = initialTeam || "";
        if (initialTeam) wrap.appendChild(teamDiv);
      } else {
        const teamInput = document.createElement("textarea");
        teamInput.className = "cell-field team";
        teamInput.rows = 1;
        teamInput.value = initialTeam || "";
        teamInput.placeholder = "Equipe";
        teamInput.setAttribute("data-cellkey", cellKey);
        teamInput.setAttribute("data-field", "team");

        const persist = () => {
          const cur = loadCells(currentMonday);
          const ck = teamInput.getAttribute("data-cellkey");
          if (!cur[ck]) cur[ck] = {};
          cur[ck].team = teamInput.value;
          if (cur[ck].team) {
            saveCells(currentMonday, cur);
          } else {
            delete cur[ck];
            saveCells(currentMonday, cur);
          }
        };
        teamInput.addEventListener("change", persist);
        teamInput.addEventListener("input", () => autoResize(teamInput));

        wrap.appendChild(teamInput);
      }
      td.appendChild(wrap);
    }
    else {
      // Cella normale (dati precompilati o vuota)
      if (rowData[i] !== undefined && rowData[i] !== "") {
        td.innerHTML = rowData[i];
      } else {
        td.innerHTML = empty();
      }
    }
    tr.appendChild(td);
  }
  return tr;
}

/* Crea la barra di sezione (MATTINA / POMERIGGIO) */
function makeSectionBar(text, sectionClass, daysCount) {
  const tr = document.createElement("tr");
  tr.className = "section-bar " + sectionClass;
  const td = document.createElement("td");
  td.colSpan = daysCount + 1; // +1 per colonna etichette
  td.textContent = text;
  tr.appendChild(td);
  return tr;
}

function render() {
  const head = document.getElementById("turnoHead");
  const body = document.getElementById("turnoBody");
  head.innerHTML = "";
  body.innerHTML = "";

  // --- Header giorni ---
  const days = [];
  for (let i = 0; i < 6; i++) {
    const d = new Date(currentMonday);
    d.setDate(currentMonday.getDate() + i);
    days.push(d);
  }
  const sun = new Date(currentMonday);
  sun.setDate(currentMonday.getDate() + 6);
  days.push(sun);

  let headHtml = "<tr>";
  const monthLabel = mesiNomi[currentMonday.getMonth()].toUpperCase();
  headHtml += '<th class="col-cat">' + monthLabel + '</th>';
  for (let i = 0; i < days.length; i++) {
    const d = days[i];
    const isWeekend = (i >= 5);
    headHtml += '<th class="day' + (isWeekend ? ' weekend' : '') + '">'
              + '<span class="day-name">' + giorniNomi[d.getDay()] + '</span>'
              + '<span class="day-num">' + d.getDate() + '</span></th>';
  }
  headHtml += "</tr>";
  head.innerHTML = headHtml;

  // --- Corpo ---
  const key = isoDate(currentMonday);
  const data = weeksData[key] || {};
  const daysCount = days.length; // 7
  const cellsData = loadCells(currentMonday);

  // Selezione righe in base alla vista corrente
  const mRows = currentView === "servizi" ? serviziMorningRows : morningRows;
  const aRows = currentView === "servizi" ? serviziAfternoonRows : afternoonRows;
  const fRows = currentView === "servizi" ? [] : fullDayRows;

  // Aggiorna titolo documento in base alla vista
  if (currentView === "servizi") {
    document.getElementById("docTitle").textContent = "Turno Settimanale Infermieri · Servizi";
    document.getElementById("docSubtitle").innerHTML = "Assegnazione del personale infermieristico ai servizi di reparto";
    document.getElementById("toolbarTitle").textContent = "Gestione Infermieri · Servizi";
    document.getElementById("toolbarLogo").textContent = "SV";
  } else {
    document.getElementById("docTitle").textContent = "Turno Settimanale Infermieri · Sale Operatorie";
    document.getElementById("docSubtitle").innerHTML = "Assegnazione del personale infermieristico alle sale e servizi di reparto<span class=\"edit-hint no-print\">· i nomi delle sale sono modificabili (clicca sulla cella)</span>";
    document.getElementById("toolbarTitle").textContent = "Gestione Infermieri · Sale Operatorie";
    document.getElementById("toolbarLogo").textContent = "SO";
  }

  // Blocco MATTINA
  body.appendChild(makeSectionBar("Mattina", "morning", daysCount));
  mRows.forEach(row => body.appendChild(makeRow(row, days, data, "morning", cellsData, currentMonday)));

  // Blocco POMERIGGIO
  body.appendChild(makeSectionBar("Pomeriggio", "afternoon", daysCount));
  aRows.forEach(row => body.appendChild(makeRow(row, days, data, "afternoon", cellsData, currentMonday)));

  // Righe intere (Reperibilità / Assenze) — solo nella vista Sale Operatorie
  fRows.forEach(row => body.appendChild(makeRow(row, days, data, "neutral", cellsData, currentMonday)));

  // --- Display settimana ---
  const endDate = new Date(currentMonday);
  endDate.setDate(currentMonday.getDate() + 6);
  const range = currentMonday.getDate() + " " + mesiNomi[currentMonday.getMonth()].slice(0,3)
             + " – " + endDate.getDate() + " " + mesiNomi[endDate.getMonth()].slice(0,3)
             + " " + endDate.getFullYear();
  document.getElementById("weekDisplay").textContent = range;
  document.getElementById("weekRange").textContent = range;
  document.getElementById("weekNumber").textContent = weekNumber(currentMonday);

  // Auto-resize di tutte le textarea dopo che il DOM è completo
  // Usa setTimeout per assicurarsi che il layout sia calcolato
  function resizeAll() {
    each(document.querySelectorAll("textarea.cell-field"), autoResize);
  }
  resizeAll();
  setTimeout(resizeAll, 50);
  setTimeout(resizeAll, 200);
  if (typeof requestAnimationFrame === "function") {
    requestAnimationFrame(resizeAll);
  }
}

/* ---------- Eventi ---------- */
const allCellFields = () => document.querySelectorAll('.cell-field');

/* Helper: itera su NodeList o Array (compatibile QtWebKit/wkhtmltopdf) */
function each(list, fn) {
  for (var i = 0; i < list.length; i++) fn(list[i], i);
}

/* ---------- Switch vista (Sale Operatorie / Servizi) ---------- */
each(document.querySelectorAll(".view-tab"), function(tab) {
  tab.addEventListener("click", function() {
    each(document.querySelectorAll(".view-tab"), function(t) { t.classList.remove("active"); });
    tab.classList.add("active");
    currentView = tab.getAttribute("data-view");
    render();
  });
});

document.getElementById("prevWeek").addEventListener("click", () => {
  const d = new Date(currentMonday); d.setDate(d.getDate() - 7); currentMonday = d; render();
});
document.getElementById("nextWeek").addEventListener("click", () => {
  const d = new Date(currentMonday); d.setDate(d.getDate() + 7); currentMonday = d; render();
});
document.getElementById("todayWeek").addEventListener("click", () => {
  currentMonday = getMonday(new Date()); render();
});
document.getElementById("printBtn").addEventListener("click", () => {
  // Nascondi placeholder delle celle vuote prima di stampare
  each(allCellFields(), function(f) {
    if (!f.value) { f.setAttribute('data-old-ph', f.placeholder); f.placeholder = ''; }
  });
  document.body.classList.add('printing');
  window.print();
  // Ripristina dopo la stampa
  setTimeout(() => {
    document.body.classList.remove('printing');
    each(allCellFields(), function(f) {
      const old = f.getAttribute('data-old-ph');
      if (old !== null) { f.placeholder = old; f.removeAttribute('data-old-ph'); }
    });
  }, 300);
});

/* ---------- Gestione stampa nativa (Ctrl+P) ---------- */
window.addEventListener('beforeprint', () => {
  each(allCellFields(), function(f) {
    if (!f.value) { f.setAttribute('data-old-ph', f.placeholder); f.placeholder = ''; }
  });
  document.body.classList.add('printing');
});
window.addEventListener('afterprint', () => {
  document.body.classList.remove('printing');
  each(allCellFields(), function(f) {
    const old = f.getAttribute('data-old-ph');
    if (old !== null) { f.placeholder = old; f.removeAttribute('data-old-ph'); }
  });
});

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (e.key === "ArrowLeft")  document.getElementById("prevWeek").click();
  if (e.key === "ArrowRight") document.getElementById("nextWeek").click();
});

/* ---------- Avvio ---------- */
(function init(){
  const isPrintMode = window.location.search.indexOf('print=1') !== -1;
  // Parametro view per selezionare la vista (sale/servizi) via URL
  // (compatibile QtWebKit: non usa URLSearchParams)
  var viewParam = null;
  var qs = window.location.search.substring(1);
  var pairs = qs.split('&');
  for (var pi = 0; pi < pairs.length; pi++) {
    var kv = pairs[pi].split('=');
    if (kv[0] === 'view') { viewParam = decodeURIComponent(kv[1] || ''); break; }
  }
  if (viewParam === 'servizi') {
    currentView = 'servizi';
    each(document.querySelectorAll(".view-tab"), function(t) {
      // Compatibile QtWebKit: classList.toggle con 2 arg non supportato
      if (t.getAttribute("data-view") === "servizi") { t.classList.add("active"); }
      else { t.classList.remove("active"); }
    });
  } else if (viewParam === 'sale') {
    currentView = 'sale';
  }
  if (weeksData[isoDate(currentMonday)]) {
    render();
  } else {
    currentMonday = new Date("2026-06-15T00:00:00");
    render();
  }
  // Modalità stampa (per generazione PDF via wkhtmltopdf con ?print=1):
  // applicata DOPO render() così gli input esistono già
  if (isPrintMode) {
    document.body.classList.add('printing');
    each(allCellFields(), function(f) { if (!f.value) f.placeholder = ''; });
  }
})();
</script>
